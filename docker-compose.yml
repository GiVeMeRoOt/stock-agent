version: "3.9"

services:
  app:
    build: .
    image: daily-stock-picker:latest
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: uvicorn dsp.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: dsp
      POSTGRES_DB: dsp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
